<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The Phraseosphere — Fluent by Amrit</title>
    <meta name="description" content="Master English idioms with clear meanings and real‑life examples.">
    <meta property="og:title" content="The Phraseosphere — Fluent by Amrit">
    <meta property="og:description" content="Master English idioms with clear meanings and real‑life examples.">
    <meta property="og:type" content="article">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
    <meta name="theme-color" content="#ff8906">

    <style>
        :root {
            --bg: #0d0d1a;
            --sur: #161628;
            --sur2: #1e1e38;
            --brd: #2e2e52;
            --txt: #e8e8f0;
            --mut: #7070a0;
            --acc: #ff8906;
            --ac2: #f9c74f;
            --grn: #06d6a0;
            --blu: #3da9fc;
            --red: #ef4565;
            --pur: #9b72cf;
            --ex-usage: #c4c4e6;

            --t1-fill: #ff8906; --t1-dark: #7a3800;
            --t2-fill: #06d6a0; --t2-dark: #00503c;
            --t3-fill: #3da9fc; --t3-dark: #003d6b;
            --t4-fill: #9b72cf; --t4-dark: #3d1f6e;
            --t5-fill: #f9c74f; --t5-dark: #5a4200;

            --fs-xs: 0.72rem; --fs-sm: 0.88rem; --fs-base: 1.05rem;
            --fs-md: 1.2rem; --fs-lg: 1.5rem; --fs-xl: 2.1rem; --fs-2xl: 2.7rem;
            --gap-sm: 14px; --gap-md: 28px; --gap-lg: 56px;
            --max-w: 740px; --card-radius: 20px;
        }

        /* … (existing resets, top-nav, page-wrapper, header, example-card, etc. – unchanged) … */
        /* I'll include the full unchanged CSS except for the new filtering-specific styles */

        /* ═══════════════ NEW: STATS BAR & PILL FILTERS ═══════════════ */
        #stats-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: var(--gap-md);
            font-size: var(--fs-xs);
            color: var(--mut);
            font-weight: 700;
            flex-wrap: wrap;
        }

        #filter-pills {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 8px 0 12px;
            margin-bottom: var(--gap-md);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--brd) transparent;
        }

        #filter-pills::-webkit-scrollbar {
            height: 4px;
        }
        #filter-pills::-webkit-scrollbar-thumb {
            background: var(--brd);
            border-radius: 2px;
        }

        .pill-btn {
            background: var(--sur2);
            border: 1.5px solid var(--brd);
            color: var(--mut);
            border-radius: 50px;
            padding: 8px 18px;
            font-size: var(--fs-xs);
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: all .2s;
            font-family: inherit;
            letter-spacing: .3px;
            flex-shrink: 0;
        }

        .pill-btn:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        .pill-btn.active {
            background: var(--acc);
            border-color: var(--acc);
            color: #0d0d1a;
            font-weight: 900;
            box-shadow: 0 0 12px rgba(255,137,6,0.3);
        }

        /* Hide filtered-out rows / cards */
        .desktop-table tr.filtered,
        .mobile-cards .content-section.filtered {
            display: none;
        }

        /* (rest of existing CSS – hub-fab, modal, footer, responsive – unchanged) */
    </style>
</head>
<body>

    <nav id="top-nav">
        <a class="nav-brand" href="hub.html">Fluent</a>
        <div style="display: flex; gap: 8px;">
            <button class="nav-btn" onclick="goToPrev()" id="btn-prev" disabled>← Previous</button>
            <button class="nav-btn" onclick="goToNext()" id="btn-next" disabled>Next →</button>
        </div>
    </nav>

    <button id="hub-fab" onclick="goToHub()" title="Back to Hub">🏠 Hub</button>

    <div id="page-wrapper">
        <header id="page-header">
            <div id="header-visual"></div>
            <div id="header-category">The Phraseosphere</div>
            <h1 id="header-title"></h1>
            <p id="header-subtitle"></p>
            <div id="header-meta"></div>
        </header>

        <main id="content-body">
            <!-- STATS & FILTER PILLS (dynamic) -->
            <div id="stats-bar"></div>
            <div id="filter-pills"></div>

            <div id="desktop-table" class="desktop-table-wrapper"></div>
            <div id="mobile-cards" class="mobile-cards"></div>

            <section id="topic-section" style="display: none;">
                <button class="btn-topic-choose" onclick="openModal()">
                    📂 Choose Another Topic
                </button>
            </section>
        </main>
    </div>

    <!-- MODAL (unchanged) -->
    <div class="modal-overlay" id="topic-modal">
        <div class="modal-content">
            <h2>Explore Topics</h2>
            <div class="modal-topics-list">
                <!-- (unchanged) -->
            </div>
            <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
    </div>

    <footer id="page-footer">
        <!-- (unchanged) -->
    </footer>

    <script>
        (function() {
            // ── Data & state ──
            const BASE_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRf3J6Gr15efJH6zt_mEJcFf-gfjOmSYYXSAsFGJXoKZp89w3lRz72wnvRo6pwN6E_h2hdhlZb6swPc/pub?output=csv';
            let allLessons = [];
            let currentLesson = null;
            let currentIndex = -1;
            let activeCategory = 'all';            // current filter
            let allGroups = [];                    // store full groups for reference

            // ── Helpers (getPlayerName, goToHub, etc.) ──
            // ... (unchanged) ...

            function renderLesson(lesson, dataRows) {
                // Header
                document.getElementById('header-visual').textContent = lesson.meta_visual || '💬';
                document.getElementById('header-title').textContent = lesson.title;
                document.getElementById('header-subtitle').textContent = lesson.description || '';
                const metaDiv = document.getElementById('header-meta');
                metaDiv.innerHTML = '';
                if (lesson.meta_badges) {
                    lesson.meta_badges.split(',').forEach(b => {
                        const span = document.createElement('span');
                        span.className = 'meta-badge';
                        span.textContent = b.trim();
                        metaDiv.appendChild(span);
                    });
                }
                document.getElementById('topic-section').style.display = 'block';

                // Group rows by category
                const groups = [];
                let currentGroup = null;
                for (const row of dataRows) {
                    if (row.length < 4) continue;
                    const category = row[0].trim();
                    const phrase = row[1].trim();
                    const meaning = row[2].trim();
                    const example = row[3].trim();
                    if (!category || !phrase || !meaning) continue;

                    if (!currentGroup || currentGroup.name !== category) {
                        currentGroup = { name: category, items: [] };
                        groups.push(currentGroup);
                    }
                    currentGroup.items.push({ phrase, meaning, example });
                }
                allGroups = groups; // save for filter

                // ── Build stats bar ──
                const totalIdioms = groups.reduce((sum, g) => sum + g.items.length, 0);
                const totalCats = groups.length;
                document.getElementById('stats-bar').innerHTML =
                    `<span>📊 Total Idioms: <strong>${totalIdioms}</strong></span> <span>📂 Categories: <strong>${totalCats}</strong></span>`;

                // ── Build filter pills ──
                const pillContainer = document.getElementById('filter-pills');
                pillContainer.innerHTML = '';
                // "All" pill
                const allPill = document.createElement('button');
                allPill.className = 'pill-btn active';
                allPill.textContent = 'All';
                allPill.addEventListener('click', () => setActiveFilter('all'));
                pillContainer.appendChild(allPill);

                // Category pills
                groups.forEach(group => {
                    const pill = document.createElement('button');
                    pill.className = 'pill-btn';
                    pill.textContent = group.name;
                    pill.addEventListener('click', () => setActiveFilter(group.name));
                    pillContainer.appendChild(pill);
                });

                // ── Build desktop table (with data-category) ──
                const tableDiv = document.getElementById('desktop-table');
                tableDiv.innerHTML = '';
                if (groups.length > 0) {
                    const table = document.createElement('table');
                    table.className = 'desktop-table';
                    table.innerHTML = `
                        <thead><tr>
                            <th>Phrase</th><th>Meaning</th><th>Example</th>
                        </tr></thead><tbody></tbody>`;
                    const tbody = table.querySelector('tbody');
                    groups.forEach(group => {
                        group.items.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.dataset.category = group.name;
                            const tdPhrase = document.createElement('td');
                            tdPhrase.className = 'phrase-cell';
                            tdPhrase.textContent = item.phrase;
                            const tdMeaning = document.createElement('td');
                            tdMeaning.innerHTML = formatMeaning(item.meaning);
                            const tdExample = document.createElement('td');
                            tdExample.textContent = item.example;
                            tdExample.style.fontStyle = 'italic';
                            tdExample.style.color = 'var(--ex-usage)';
                            tr.appendChild(tdPhrase);
                            tr.appendChild(tdMeaning);
                            tr.appendChild(tdExample);
                            tbody.appendChild(tr);
                        });
                    });
                    tableDiv.appendChild(table);
                }

                // ── Build mobile cards (with data-category on sections) ──
                const mobileDiv = document.getElementById('mobile-cards');
                mobileDiv.innerHTML = '';
                groups.forEach(group => {
                    const section = document.createElement('section');
                    section.className = 'content-section';
                    section.dataset.category = group.name;
                    const slug = group.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                    section.innerHTML = `
                        <h2 class="section-heading" id="${slug}">
                            <span class="section-icon">📌</span> ${group.name}
                        </h2>`;
                    group.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'example-card';
                        card.innerHTML = `
                            <div class="example-phrase">${item.phrase}</div>
                            <div class="example-meaning">${formatMeaning(item.meaning)}</div>
                            <div class="example-usage">"${item.example}"</div>`;
                        section.appendChild(card);
                    });
                    mobileDiv.appendChild(section);
                });

                // Apply initial filter (should show all)
                applyFilter('all');
            }

            function setActiveFilter(category) {
                activeCategory = category;
                // Update pill states
                document.querySelectorAll('#filter-pills .pill-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent === category || (category === 'all' && btn.textContent === 'All'));
                });
                applyFilter(category);
            }

            function applyFilter(category) {
                // Desktop table rows
                const rows = document.querySelectorAll('#desktop-table tbody tr');
                rows.forEach(row => {
                    if (category === 'all' || row.dataset.category === category) {
                        row.classList.remove('filtered');
                    } else {
                        row.classList.add('filtered');
                    }
                });

                // Mobile card sections
                const sections = document.querySelectorAll('#mobile-cards .content-section');
                sections.forEach(sec => {
                    if (category === 'all' || sec.dataset.category === category) {
                        sec.classList.remove('filtered');
                    } else {
                        sec.classList.add('filtered');
                    }
                });
            }

            // ── All other functions (loadIndex, fetchLessonSheet, etc.) unchanged ──
            // ...

            // ── Init (same as before, but after renderLesson we already have pills) ──
            async function init() {
                // ... (unchanged, but calls renderLesson which now builds pills) ...
            }

            // Expose functions
            window.goToHub = goToHub;
            window.goToNext = goToNext;
            window.goToPrev = goToPrev;
            window.openModal = openModal;
            window.closeModal = closeModal;
            window.toggleModalCard = toggleModalCard;
            window.showComingSoon = showComingSoon;

            init();
        })();
    </script>
</body>
</html>
