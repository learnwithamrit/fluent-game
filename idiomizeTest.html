<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Idiomize — Fluent by Amrit</title>

    <!-- Search Engine Optimisation -->
    <meta name="description" content="Fluent by Amrit — quiz yourself on English idioms. Multi‑select quiz, batches of 10‑50. Play free online.">
    <meta name="keywords" content="Fluent game by Amrit, idiom quiz, English idiom game, multi‑select quiz, learn idioms">
    <meta name="author" content="Amrit">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Idiomize — Fluent by Amrit">
    <meta property="og:description" content="Test your knowledge of English idioms with a multi‑select quiz. Part of the Fluent learning suite.">
    <meta property="og:url" content="https://learnwithamrit.github.io/idiomize/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://learnwithamrit.github.io/fluent-game/icon-512.png">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icon-96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <meta name="msapplication-TileImage" content="icon-192.png">
    <meta name="msapplication-TileColor" content="#0d0d1a">
    <meta name="theme-color" content="#10b981">

    <style>
        :root {
            --bg-deep: #121212;
            --card-bg: #1e1e1e;
            --accent: #10b981;
            --success: #10b981;
            --error: #ef4444;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --card-radius: 20px;
            --btn-radius: 14px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            background: #0a0a0a;
            font-family: var(--font-sans);
            display: flex; justify-content: center; align-items: center;
            padding: 0; -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none; touch-action: manipulation;
            overflow: hidden;
        }

        .idiom-app {
            width: 100%; height: 100%;
            background: var(--bg-deep);
            display: flex; flex-direction: column; overflow: hidden;
            position: relative; transition: all 0.3s ease;
        }

        @media (min-width: 500px) {
            body { padding: 16px; }
            .idiom-app {
                max-width: 540px; height: auto; min-height: 85vh; max-height: 95vh;
                border-radius: 32px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
            }
        }
        @media (min-width: 768px) {
            .idiom-app { max-width: 90%; min-height: 80vh; max-height: 92vh; border-radius: 36px; }
        }
        @media (min-width: 1200px) {
            .idiom-app { max-width: 1100px; min-height: 75vh; max-height: 90vh; border-radius: 40px; }
        }
        @media (min-width: 1600px) {
            .idiom-app { max-width: 1400px; }
        }

        /* Header */
        .idiom-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; background: #1a1a1a;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 6px; flex-shrink: 0; flex-wrap: nowrap; min-height: 54px;
        }
        .idiom-header-item {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.72rem; color: var(--text-secondary);
            white-space: nowrap; letter-spacing: 0.01em;
        }
        .idiom-header-item .icon { font-size: 0.9rem; }
        .idiom-header-item .value {
            color: var(--text-primary); font-weight: 600;
            font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.78rem;
        }
        .idiom-score-item.muted { opacity: 0.35; }
        .idiom-header-divider {
            width: 1px; height: 18px; background: rgba(255,255,255,0.1);
            flex-shrink: 0; border-radius: 1px;
        }

        /* Main content */
        .idiom-main {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 16px; overflow-y: auto; gap: 20px; min-height: 0;
        }

        /* Buttons */
        .idiom-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 24px; border-radius: var(--btn-radius); font-size: 0.95rem;
            font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;
            font-family: var(--font-sans); letter-spacing: 0.01em; white-space: nowrap;
        }
        .idiom-btn:active { transform: scale(0.96); }
        .idiom-btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 24px rgba(16,185,129,0.35); }
        .idiom-btn-outline { background: transparent; color: var(--text-primary); border: 2px solid rgba(255,255,255,0.2); }
        .idiom-btn-ghost { background: transparent; color: var(--text-secondary); padding: 12px 20px; font-size: 0.9rem; }
        .idiom-btn-full { width: 100%; max-width: 360px; }
        .idiom-btn-lg { padding: 16px 32px; font-size: 1.1rem; border-radius: 18px; }

        /* Batch selection */
        .idiom-batch-screen { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
        .idiom-title { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .idiom-title .accent { color: var(--accent); }
        .idiom-select {
            background: var(--card-bg); border: 2px solid rgba(255,255,255,0.1);
            border-radius: var(--btn-radius); padding: 12px 16px; color: var(--text-primary);
            font-size: 1rem; font-family: var(--font-sans); outline: none; width: 200px;
            text-align: center; cursor: pointer;
        }
        .idiom-select:focus { border-color: var(--accent); }

        /* Quiz */
        .idiom-quiz-card {
            background: var(--card-bg); border-radius: var(--card-radius); padding: 18px 22px;
            text-align: center; border: 1px solid rgba(255,255,255,0.08); width: 100%; max-width: 420px;
        }
        .idiom-quiz-bengali { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); line-height: 1.5; }

        .idiom-options-list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; }
        .idiom-option-btn {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
            background: var(--card-bg); border: 2px solid rgba(255,255,255,0.1);
            border-radius: var(--btn-radius); color: var(--text-primary); font-size: 0.9rem;
            cursor: pointer; text-align: left; transition: all 0.2s; font-family: var(--font-sans);
            min-height: 54px; position: relative;
        }
        .idiom-option-btn.selected {
            border-color: var(--accent); background: rgba(16,185,129,0.12);
        }
        .idiom-option-btn .check-circle {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: all 0.2s; font-size: 0.8rem; color: transparent;
        }
        .idiom-option-btn.selected .check-circle {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }
        .idiom-option-btn .check-circle::after { content: '✓'; font-weight: bold; }

        .idiom-hint-text {
            color: var(--error); font-size: 0.85rem; font-weight: 500; text-align: center;
            min-height: 20px; margin-top: 8px;
        }

        .idiom-option-btn.correct-flash {
            border-color: var(--success) !important;
            background: rgba(16,185,129,0.15) !important;
            animation: pulse-green 0.5s ease-out;
        }
        @keyframes pulse-green {
            0%,100% { box-shadow: 0 0 8px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 28px rgba(16,185,129,0.7); }
        }

        /* Full‑app correct flash */
        .idiom-app.correct-flash {
            animation: appFlashGreen 0.6s ease-out;
        }
        @keyframes appFlashGreen {
            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.6), inset 0 0 0 0 rgba(16,185,129,0.4); }
            40%  { box-shadow: 0 0 30px 10px rgba(16,185,129,0.5), inset 0 0 40px 10px rgba(16,185,129,0.25); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0), inset 0 0 0 0 rgba(16,185,129,0); }
        }

        /* Modal */
        .idiom-modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center; z-index: 50;
            animation: fadeIn 0.25s ease; border-radius: inherit;
        }
        .idiom-modal-panel {
            background: var(--card-bg); border-radius: 24px; padding: 28px 24px;
            text-align: center; max-width: 340px; width: 90%;
            border: 1px solid rgba(239,68,68,0.4);
            box-shadow: 0 20px 48px rgba(0,0,0,0.8);
        }
        .idiom-modal-bengali { font-size: 1.1rem; color: var(--text-primary); font-weight: 600; margin-bottom: 4px; }
        .idiom-modal-correct { font-size: 1rem; color: var(--success); font-weight: 700; margin-bottom: 20px; }
        .idiom-modal-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }

        /* Results */
        .idiom-results { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; padding: 12px; }
        .idiom-results-score { font-size: 3.2rem; font-weight: 800; color: var(--text-primary); }
        .idiom-results-badge { padding: 8px 22px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; }
        .badge-gold { background: rgba(251,191,36,0.2); color:#fbbf24; border:1px solid rgba(251,191,36,0.4); }
        .badge-silver { background: rgba(156,163,175,0.2); color:#d1d5db; border:1px solid rgba(156,163,175,0.4); }
        .badge-bronze { background: rgba(180,130,90,0.2); color:#d4a574; border:1px solid rgba(180,130,90,0.4); }

        .idiom-bottom-nav {
            padding: 10px 16px calc(12px + var(--safe-bottom));
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.04); background: rgba(0,0,0,0.2);
        }

        .hidden { display: none !important; }
        .text-muted { color: var(--text-secondary); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Refill toast */
        .idiom-refill-toast {
            background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.5);
            color: #fbbf24; padding: 10px 18px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 500; text-align: center;
            max-width: 300px; margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="idiom-app" id="idiomApp">
    <header class="idiom-header" id="idiomHeader">
        <div class="idiom-header-item"><span class="icon">👤</span><span class="value" id="headerPlayerName">Player</span></div>
        <div class="idiom-header-divider"></div>
        <div class="idiom-header-item"><span class="icon">📄</span><span class="value" id="headerCardIndex">Ques: 0/0</span></div>
        <div class="idiom-header-divider"></div>
        <div class="idiom-header-item idiom-score-item muted" id="headerScoreItem"><span class="icon">🏆</span><span class="value" id="headerScore">--/--</span></div>
        <div class="idiom-header-divider"></div>
        <div class="idiom-header-item"><span class="icon">⏱️</span><span class="value" id="headerTimer">00:00</span></div>
    </header>

    <div class="idiom-main" id="idiomMain"></div>

    <div class="idiom-bottom-nav" id="idiomBottomNav"></div>

    <div class="idiom-modal-overlay hidden" id="idiomModal"></div>

    <!-- Celebration overlay (same as Proverb Game) -->
    <div id="correct-overlay" aria-live="assertive" aria-label="Correct!">
        <div id="correct-card">
            <div id="correct-icon">✓</div>
            <div id="correct-word">CORRECT</div>
        </div>
    </div>
</div>

<script>
(function() {
    // ---------- CONFIG ----------
    const CONFIG = {
        googleSheetCSVUrl: 'YOUR_GOOGLE_SHEET_CSV_URL_HERE',   // ← Replace with your published CSV URL
        fallbackData: [
            { bengali: ['বিরক্ত / ক্লান্ত'], english: ['Sick and tired', 'Fed up'], distractors: ['Tired and sick', 'Bored and tired', 'Angry and fed up', 'Exhausted and annoyed'] },
            { bengali: ['অল্প বিদ্যা ভয়ংকরী'], english: ['A little learning is a dangerous thing'], distractors: ['Little knowledge is safe', 'A little wisdom is enough', 'Learning a little is great', 'Small knowledge is power'] },
            { bengali: ['চোখের বালি'], english: ['Eyesore', 'A thorn in the flesh'], distractors: ['Eye candy', 'A pain in the neck', 'A sight for sore eyes', 'A beautiful view'] },
            { bengali: ['মাথা খাটানো'], english: ['Rack one’s brain'], distractors: ['Use one’s head', 'Brainstorm hard', 'Think hardly', 'Ponder deeply'] },
            { bengali: ['গোড়ায় গলদ'], english: ['Something wrong at the root'], distractors: ['Root cause is fine', 'Problem at the top', 'No issue at base', 'A faulty foundation'] },
            { bengali: ['হাতির পাঁচ পা দেখা'], english: ['To see the impossible'], distractors: ['To see an elephant with five legs', 'To witness a miracle', 'To spot a rare animal', 'To dream big'] },
            { bengali: ['নাড়িতে রক্ত থাকা'], english: ['To have blood in one’s veins'], distractors: ['To be cold-blooded', 'To have red blood cells', 'To bleed easily', 'To be brave'] },
            { bengali: ['বাঘের চামড়ায় ঢাকা'], english: ['A wolf in sheep’s clothing'], distractors: ['A tiger in a sheep skin', 'A fox in a hen house', 'A dog in a blanket', 'A cat in a hat'] },
            { bengali: ['আকাশ থেকে পড়া'], english: ['Out of the blue'], distractors: ['Falling from the sky', 'A bolt from the heavens', 'Suddenly from above', 'A surprise'] },
            { bengali: ['কান কাটা'], english: ['Shameless'], distractors: ['Earless', 'Bold', 'Outspoken', 'Brazen'] }
        ],
        HUB_URL: '../index.html'   // change to your hub page
    };

    // ---------- STATE ----------
    const state = {
        playerName: 'Player',
        phase: 'batch',   // 'batch' | 'quiz' | 'results'
        allProverbs: [],
        remainingPool: [],
        sessionProverbs: [],
        quizOrder: [],
        currentQuizIndex: 0,
        score: 0,
        timerSeconds: 0,
        timerIntervalId: null,
        batchSize: 10,   // default
        totalInSession: 10,
        currentOptions: [],
        correctIndices: new Set(),
        selectedOptions: new Set(),
        showRefillMessage: false,
    };

    // ---------- DOM REFS ----------
    const appContainer = document.getElementById('idiomApp');
    const mainContent = document.getElementById('idiomMain');
    const bottomNav = document.getElementById('idiomBottomNav');
    const modalOverlay = document.getElementById('idiomModal');
    const headerPlayerName = document.getElementById('headerPlayerName');
    const headerCardIndex = document.getElementById('headerCardIndex');
    const headerScore = document.getElementById('headerScore');
    const headerScoreItem = document.getElementById('headerScoreItem');
    const headerTimer = document.getElementById('headerTimer');

    // ---------- UTILS ----------
    function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatVariantList(variants) { return variants.map(v => '• ' + escapeHTML(v)).join('<br>'); }

    function startTimer() {
        stopTimer();
        state.timerSeconds = 0;
        updateTimerDisplay();
        state.timerIntervalId = setInterval(() => { state.timerSeconds++; updateTimerDisplay(); }, 1000);
    }
    function stopTimer() { if (state.timerIntervalId) { clearInterval(state.timerIntervalId); state.timerIntervalId = null; } }
    function updateTimerDisplay() {
        const m = Math.floor(state.timerSeconds/60), s = state.timerSeconds%60;
        headerTimer.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }
    function formatTime(sec) { const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

    function updateHeaderPlayerName() { headerPlayerName.textContent = state.playerName; }
    function updateHeaderCardIndex() {
        if (state.phase === 'quiz') {
            headerCardIndex.textContent = `Ques: ${state.currentQuizIndex+1}/${state.totalInSession}`;
        } else {
            headerCardIndex.textContent = `--/${state.totalInSession}`;
        }
    }
    function updateHeaderScore() {
        if (state.phase === 'quiz' || state.phase === 'results') {
            headerScoreItem.classList.remove('muted');
            headerScore.textContent = `${String(state.score).padStart(2,'0')}/${state.totalInSession}`;
        } else {
            headerScoreItem.classList.add('muted');
            headerScore.textContent = `--/${state.totalInSession}`;
        }
    }

    // Celebration
    function showCorrect() {
        const overlay = document.getElementById('correct-overlay');
        if (!overlay) return;
        overlay.classList.add('active');
        setTimeout(() => overlay.classList.remove('active'), 900);
    }

    // ---------- DATA LOADING ----------
    function parseCSV(txt) {
        const rows = [];
        txt.trim().split(/\r?\n/).forEach(line => {
            if (!line.trim()) return;
            const cols = [];
            let cur = '', inQ = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQ && i+1 < line.length && line[i+1] === '"') { cur += '"'; i++; }
                    else inQ = !inQ;
                } else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
                else cur += ch;
            }
            cols.push(cur.trim());
            if (cols.length >= 6) {
                const bengali = cols[0].split(';').map(s => s.trim()).filter(Boolean);
                const english = cols[1].split(';').map(s => s.trim()).filter(Boolean);
                const distractors = [cols[2], cols[3], cols[4], cols[5]];
                rows.push({
                    bengali: bengali.length ? bengali : [cols[0]],
                    english: english.length ? english : [cols[1]],
                    distractors: distractors
                });
            }
        });
        return rows;
    }

    async function loadData() {
        if (CONFIG.googleSheetCSVUrl && CONFIG.googleSheetCSVUrl.trim() !== '') {
            try {
                const res = await fetch(CONFIG.googleSheetCSVUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const csv = await res.text();
                const parsed = parseCSV(csv);
                if (parsed.length > 0) {
                    const firstCell = parsed[0].bengali?.[0]?.toLowerCase();
                    if (firstCell === 'bengali' || firstCell === 'bengali expression') parsed.shift();
                }
                if (parsed.length >= 10) {
                    state.allProverbs = parsed;
                    state.remainingPool = [...parsed];
                    return;
                }
            } catch (e) {
                console.warn('Sheet fetch failed, using fallback.');
            }
        }
        state.allProverbs = CONFIG.fallbackData.map(item => ({
            bengali: [...item.bengali],
            english: [...item.english],
            distractors: [...item.distractors]
        }));
        state.remainingPool = [...state.allProverbs];
    }

    // ---------- POOL MANAGEMENT ----------
    function refillPoolIfNeeded() {
        if (state.remainingPool.length < state.batchSize) {
            state.remainingPool = [...state.allProverbs];
            state.showRefillMessage = true;
        } else {
            state.showRefillMessage = false;
        }
    }

    function selectSessionProverbs() {
        refillPoolIfNeeded();
        const shuffled = [...state.remainingPool];
        for (let i = shuffled.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        state.sessionProverbs = shuffled.slice(0, state.batchSize);
        state.remainingPool = shuffled.slice(state.batchSize);
        state.quizOrder = [...Array(state.batchSize).keys()];
        for (let i = state.quizOrder.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [state.quizOrder[i], state.quizOrder[j]] = [state.quizOrder[j], state.quizOrder[i]];
        }
        state.currentQuizIndex = 0;
        state.score = 0;
        state.totalInSession = state.batchSize;
        state.selectedOptions.clear();
        updateHeaderScore();
        updateHeaderCardIndex();
    }

    // ---------- RENDER: BATCH SELECTION ----------
    function renderBatchSelection() {
        state.phase = 'batch';
        stopTimer();
        updateHeaderScore();
        updateHeaderCardIndex();
        headerCardIndex.textContent = `--/${state.totalInSession}`;
        headerScoreItem.classList.add('muted');
        headerScore.textContent = `--/${state.totalInSession}`;

        let refillMsgHTML = '';
        if (state.showRefillMessage) {
            refillMsgHTML = '<div class="idiom-refill-toast">🔄 You’ve seen all idioms! Starting a fresh set.</div>';
            state.showRefillMessage = false;
        }

        mainContent.innerHTML = `
            <div class="idiom-batch-screen">
                <div class="idiom-title">Idio<span class="accent">mize</span></div>
                <div class="text-muted" style="font-size:0.9rem;">Select your quiz size</div>
                ${refillMsgHTML}
                <select id="batchSizeSelect" class="idiom-select">
                    <option value="10" ${state.batchSize===10?'selected':''}>10 questions</option>
                    <option value="20" ${state.batchSize===20?'selected':''}>20 questions</option>
                    <option value="30" ${state.batchSize===30?'selected':''}>30 questions</option>
                    <option value="50" ${state.batchSize===50?'selected':''}>50 questions</option>
                </select>
                <button class="idiom-btn idiom-btn-primary idiom-btn-full idiom-btn-lg" id="btnStartQuiz">🎮 Start Quiz</button>
                <a href="${CONFIG.HUB_URL}" class="idiom-btn idiom-btn-ghost idiom-btn-full" style="text-decoration:none;">← Back to Hub</a>
            </div>`;
        bottomNav.innerHTML = '';

        document.getElementById('btnStartQuiz').addEventListener('click', () => {
            const select = document.getElementById('batchSizeSelect');
            state.batchSize = parseInt(select.value);
            selectSessionProverbs();
            state.phase = 'quiz';
            startTimer();
            renderQuizQuestion();
        });
    }

    // ---------- MULTI‑SELECT QUIZ ----------
    function renderQuizQuestion() {
        if (state.currentQuizIndex >= state.totalInSession) { finishQuiz(); return; }
        state.phase = 'quiz';
        updateHeaderScore();
        updateHeaderCardIndex();
        state.selectedOptions.clear();

        const sessionIdx = state.quizOrder[state.currentQuizIndex];
        const proverb = state.sessionProverbs[sessionIdx];

        const corrects = proverb.english.slice(0, 5);
        const allDistractors = [...proverb.distractors];
        for (let i = allDistractors.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [allDistractors[i], allDistractors[j]] = [allDistractors[j], allDistractors[i]];
        }
        const needed = 5 - corrects.length;
        const chosenDistractors = allDistractors.slice(0, needed);

        const options = [
            ...corrects.map(text => ({ text, isCorrect: true })),
            ...chosenDistractors.map(text => ({ text, isCorrect: false }))
        ];
        for (let i = options.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [options[i], options[j]] = [options[j], options[i]];
        }

        state.currentOptions = options;
        state.correctIndices = new Set(options.reduce((acc, opt, idx) => {
            if (opt.isCorrect) acc.push(idx);
            return acc;
        }, []));

        mainContent.innerHTML = `
            <div class="idiom-quiz-card">
                <div class="idiom-quiz-bengali">${escapeHTML(proverb.bengali.join(' • '))}</div>
            </div>
            <div class="idiom-options-list" id="idiomOptionsList">
                ${options.map((opt, idx) => `
                    <button class="idiom-option-btn" data-index="${idx}">
                        <span class="check-circle"></span>
                        <span>${escapeHTML(opt.text)}</span>
                    </button>
                `).join('')}
            </div>
            <div class="idiom-hint-text" id="idiomHintText"></div>
            <button class="idiom-btn idiom-btn-primary idiom-btn-full" id="btnSubmitAnswer">Submit</button>
        `;
        bottomNav.innerHTML = '';

        document.querySelectorAll('.idiom-option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                if (state.selectedOptions.has(idx)) {
                    state.selectedOptions.delete(idx);
                    this.classList.remove('selected');
                } else {
                    state.selectedOptions.add(idx);
                    this.classList.add('selected');
                }
                document.getElementById('idiomHintText').textContent = '';
            });
        });

        document.getElementById('btnSubmitAnswer').addEventListener('click', checkQuizAnswer);
    }

    function checkQuizAnswer() {
        const selected = state.selectedOptions;
        const correct = state.correctIndices;
        const allBtns = document.querySelectorAll('.idiom-option-btn');
        const submitBtn = document.getElementById('btnSubmitAnswer');
        const hintEl = document.getElementById('idiomHintText');
        if (!submitBtn) return;

        if (selected.size === 0) {
            hintEl.textContent = 'Please select an option.';
            return;
        }
        hintEl.textContent = '';

        submitBtn.disabled = true;
        allBtns.forEach(b => b.style.pointerEvents = 'none');

        let anyWrong = false;
        for (const idx of selected) {
            if (!correct.has(idx)) { anyWrong = true; break; }
        }
        const isComplete = selected.size === correct.size && !anyWrong;

        if (isComplete) {
            state.score++;
            updateHeaderScore();
            document.getElementById('idiomApp').classList.add('correct-flash');
            showCorrect();
            allBtns.forEach(btn => {
                const idx = parseInt(btn.dataset.index);
                if (correct.has(idx)) btn.classList.add('correct-flash');
            });
            setTimeout(() => {
                document.getElementById('idiomApp').classList.remove('correct-flash');
                state.currentQuizIndex++;
                if (state.currentQuizIndex >= state.totalInSession) finishQuiz();
                else renderQuizQuestion();
            }, 700);
        } else {
            if (anyWrong) {
                showErrorModal('wrong');
            } else {
                const missingCount = correct.size - selected.size;
                showErrorModal('incomplete', missingCount);
            }
        }
    }

    function showErrorModal(type, missingCount = 0) {
        const proverb = state.sessionProverbs[state.quizOrder[state.currentQuizIndex]];
        let iconHtml = '', message = '', borderColor = '';
        if (type === 'incomplete') {
            iconHtml = `<div style="font-size:2.5rem; margin-bottom:10px;">🟡</div>`;
            message = `Good start! You still need to select all the correct answers. You missed ${missingCount}.`;
            borderColor = 'rgba(251,191,36,0.4)';
        } else {
            iconHtml = '<div style="font-size:2.5rem; margin-bottom:10px;">❌</div>';
            message = 'That’s incorrect.';
            borderColor = 'rgba(239,68,68,0.4)';
        }

        modalOverlay.innerHTML = `
            <div class="idiom-modal-panel" style="border-color:${borderColor};">
                ${iconHtml}
                <div class="idiom-modal-label">${message}</div>
                <div class="idiom-modal-bengali">${escapeHTML(proverb.bengali.join(' • '))}</div>
                <div class="idiom-modal-correct">→ ${formatVariantList(proverb.english)}</div>
                <button class="idiom-btn idiom-btn-primary idiom-btn-full" id="btnGotIt">👍 Got It</button>
            </div>`;
        modalOverlay.classList.remove('hidden');

        document.getElementById('btnGotIt').addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            modalOverlay.innerHTML = '';
            state.currentQuizIndex++;
            if (state.currentQuizIndex >= state.totalInSession) finishQuiz();
            else renderQuizQuestion();
        });
    }

    function finishQuiz() {
        state.phase = 'results';
        stopTimer();
        updateHeaderScore();
        updateHeaderCardIndex();
        headerCardIndex.textContent = 'Complete';

        const total = state.totalInSession, score = state.score, time = formatTime(state.timerSeconds), perc = Math.round((score/total)*100);
        let badge='badge-bronze', badgeText='🥉 Keep Practicing', emoji='📚';
        if (perc>=90){ badge='badge-gold'; badgeText='🥇 Excellent!'; emoji='🏆'; }
        else if (perc>=70){ badge='badge-silver'; badgeText='🥈 Great Job!'; emoji='🌟'; }

        mainContent.innerHTML = `
            <div class="idiom-results">
                <div style="font-size:3rem;">${emoji}</div>
                <div class="idiom-results-score">${score}<span style="color:var(--text-secondary);">/</span>${total}</div>
                <span class="idiom-results-badge ${badge}">${badgeText}</span>
                <div class="text-muted"><p>⏱️ Time: <strong>${time}</strong></p><p>📊 Accuracy: <strong>${perc}%</strong></p></div>
            </div>`;
        bottomNav.innerHTML = `
            <button class="idiom-btn idiom-btn-primary idiom-btn-full idiom-btn-lg" id="btnPlayAgain">🔄 Play Another Session</button>
            <a href="${CONFIG.HUB_URL}" class="idiom-btn idiom-btn-ghost idiom-btn-full" style="text-decoration:none;">← Back to Hub</a>`;
        document.getElementById('btnPlayAgain').addEventListener('click', () => {
            state.showRefillMessage = false;   // will be set correctly by next refillIfNeeded
            renderBatchSelection();
        });
    }

    // ---------- INIT ----------
    async function initApp() {
        // Read player name from URL ?name=...
        const params = new URLSearchParams(window.location.search);
        const urlName = params.get('name');
        if (urlName) state.playerName = decodeURIComponent(urlName.trim());
        else state.playerName = 'Player';
        updateHeaderPlayerName();

        mainContent.innerHTML = '<div class="idiom-batch-screen"><p style="color:var(--text-secondary);">⏳ Loading data…</p></div>';
        bottomNav.innerHTML = '';

        await loadData();
        if (state.allProverbs.length < 10) {
            mainContent.innerHTML = `<div class="idiom-batch-screen"><p style="color:var(--error);">❌ Need at least 10 idioms.</p></div>`;
            return;
        }

        renderBatchSelection();
    }

    initApp();
})();
</script>
</body>
</html>
