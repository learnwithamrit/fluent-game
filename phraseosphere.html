<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The Phraseosphere — Fluent by Amrit</title>
    <meta name="description" content="Master English idioms with clear meanings and real‑life examples.">
    <meta property="og:title" content="The Phraseosphere — Fluent by Amrit">
    <meta property="og:description" content="Master English idioms with clear meanings and real‑life examples.">
    <meta property="og:type" content="article">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
    <meta name="theme-color" content="#ff8906">

    <style>
        :root {
            --bg: #0d0d1a;
            --sur: #161628;
            --sur2: #1e1e38;
            --brd: #2e2e52;
            --txt: #e8e8f0;
            --mut: #7070a0;
            --acc: #ff8906;
            --ac2: #f9c74f;
            --grn: #06d6a0;
            --blu: #3da9fc;
            --red: #ef4565;
            --ex-usage: #c4c4e6;   /* more legible example text */

            /* increased font scale */
            --fs-xs: 0.72rem;
            --fs-sm: 0.88rem;
            --fs-base: 1.05rem;
            --fs-md: 1.2rem;
            --fs-lg: 1.5rem;
            --fs-xl: 2.1rem;
            --fs-2xl: 2.7rem;

            --gap-sm: 14px;
            --gap-md: 28px;
            --gap-lg: 56px;
            --max-w: 740px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--txt);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: var(--fs-base);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 100px; /* space for FAB */
        }

        /* ── TOP NAV ── */
        #top-nav {
            width: 100%;
            background: var(--sur);
            border-bottom: 1px solid var(--brd);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 8px;
            flex-wrap: wrap;
        }

        #top-nav .nav-brand {
            font-size: var(--fs-sm);
            font-weight: 900;
            color: var(--acc);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-btn {
            background: var(--sur2);
            border: 1.5px solid var(--brd);
            color: var(--mut);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: var(--fs-xs);
            font-weight: 800;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: .3px;
            font-family: inherit;
            white-space: nowrap;
        }

        .nav-btn:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* ── PAGE WRAPPER ── */
        #page-wrapper {
            width: 100%;
            max-width: var(--max-w);
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        #page-header {
            padding: var(--gap-lg) 0 var(--gap-md);
            text-align: center;
            border-bottom: 1px solid var(--brd);
            margin-bottom: var(--gap-lg);
        }

        #header-visual {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            background: var(--sur);
            border: 2px solid var(--brd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto var(--gap-md);
            box-shadow: 0 8px 32px #00000044;
        }

        #header-category {
            font-size: var(--fs-xs);
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--acc);
            background: #ff890614;
            border: 1px solid #ff890633;
            border-radius: 20px;
            padding: 4px 14px;
            display: inline-block;
            margin-bottom: var(--gap-sm);
        }

        #header-title {
            font-size: var(--fs-xl);
            font-weight: 900;
            color: var(--txt);
            line-height: 1.2;
            letter-spacing: -.5px;
            margin-bottom: 10px;
        }

        #header-subtitle {
            font-size: var(--fs-sm);
            color: var(--mut);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        #header-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: var(--gap-md);
            flex-wrap: wrap;
        }

        .meta-badge {
            font-size: var(--fs-xs);
            color: var(--mut);
            background: var(--sur);
            border: 1px solid var(--brd);
            border-radius: 20px;
            padding: 4px 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* ── CONTENT ── */
        #content-body {
            flex: 1;
            padding-bottom: var(--gap-lg);
        }

        .content-section {
            margin-bottom: var(--gap-lg);
        }

        .section-heading {
            font-size: var(--fs-md);
            font-weight: 900;
            color: var(--txt);
            margin-bottom: var(--gap-sm);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--brd);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-heading .section-icon {
            font-size: 1.2rem;
        }

        .example-card {
            background: var(--sur);
            border: 1.5px solid var(--brd);
            border-radius: 18px;
            padding: 20px 22px;
            margin-bottom: var(--gap-sm);
            transition: border-color .2s;
        }

        .example-card:hover {
            border-color: var(--acc);
        }

        .example-card .example-phrase {
            font-size: var(--fs-md);
            font-weight: 900;
            color: var(--acc);
            margin-bottom: 8px;
        }

        .example-card .example-meaning {
            font-size: var(--fs-sm);
            color: var(--txt);
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .example-card .example-usage {
            font-size: var(--fs-sm);
            color: var(--ex-usage);   /* now clearly visible */
            font-style: italic;
            border-left: 3px solid var(--acc);
            padding-left: 14px;
            line-height: 1.7;
        }

        .example-card .example-bengali {
            font-size: var(--fs-xs);
            color: var(--grn);
            margin-top: 8px;
            font-weight: 700;
            display: inline; /* keep inline with meaning */
        }

        /* Desktop table */
        .desktop-table-wrapper {
            display: none;
            overflow-x: auto;
            margin-bottom: var(--gap-md);
        }

        .desktop-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-sm);
            background: var(--sur);
            border: 1.5px solid var(--brd);
            border-radius: 18px;
            overflow: hidden;
        }

        .desktop-table th {
            background: var(--sur2);
            color: var(--txt);
            font-weight: 900;
            padding: 18px 18px;
            text-align: left;
            border-bottom: 2px solid var(--brd);
            font-size: var(--fs-sm);
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .desktop-table td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--brd);
            color: var(--mut);
            vertical-align: top;
            line-height: 1.7;
            font-size: var(--fs-base);
        }

        .desktop-table tr:last-child td {
            border-bottom: none;
        }

        .desktop-table .phrase-cell {
            color: var(--acc);
            font-weight: 900;
            font-size: var(--fs-base);
        }

        .mobile-cards {
            display: block;
        }

        /* ── FLOATING HUB BUTTON ── */
        #hub-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 150;
            background: var(--acc);
            color: #0d0d1a;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.6rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 24px #00000088;
            transition: all .2s;
            line-height: 1;
        }

        #hub-fab:hover {
            background: #ffaa30;
            transform: scale(1.08);
        }

        /* ── CHOOSE TOPIC SECTION ── */
        #topic-section {
            margin-top: var(--gap-lg);
            text-align: center;
        }

        .btn-topic-choose {
            background: var(--acc);
            color: #0d0d1a;
            border: none;
            border-radius: 16px;
            padding: 18px 36px;
            font-size: 1.6rem;
            font-weight: 900;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            letter-spacing: .5px;
            box-shadow: 0 8px 28px #00000066;
        }

        .btn-topic-choose:hover {
            background: #ffaa30;
            transform: translateY(-3px);
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--sur);
            border: 1.5px solid var(--brd);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px #000000dd;
        }

        .modal-content h2 {
            font-size: var(--fs-lg);
            font-weight: 900;
            color: var(--txt);
            margin-bottom: 24px;
            text-align: center;
        }

        /* accordion styles */
        .accordion-item {
            margin-bottom: 12px;
            border: 1.5px solid var(--brd);
            border-radius: 14px;
            overflow: hidden;
            background: var(--sur2);
        }

        .accordion-header {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--txt);
            font-size: var(--fs-base);
            font-weight: 800;
            padding: 16px 20px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: inherit;
            transition: background .2s;
        }

        .accordion-header:hover {
            background: #ff890612;
        }

        .accordion-header .acc-icon {
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .accordion-header .arrow {
            font-size: 1rem;
            transition: transform .2s;
        }

        .accordion-item.open .accordion-header .arrow {
            transform: rotate(90deg);
        }

        .accordion-body {
            display: none;
            padding: 0 20px 16px;
        }

        .accordion-item.open .accordion-body {
            display: block;
        }

        .sub-topic-btn {
            width: 100%;
            background: var(--sur);
            border: 1px solid var(--brd);
            color: var(--txt);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 8px;
            font-size: var(--fs-sm);
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all .2s;
            font-family: inherit;
        }

        .sub-topic-btn:hover {
            border-color: var(--acc);
            background: #ff890610;
        }

        .modal-close {
            display: block;
            margin: 24px auto 0;
            background: transparent;
            border: 1.5px solid var(--brd);
            color: var(--mut);
            border-radius: 12px;
            padding: 10px 28px;
            font-size: var(--fs-sm);
            font-weight: 800;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }

        .modal-close:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        /* ── FOOTER ── */
        #page-footer {
            width: 100%;
            background: var(--sur);
            border-top: 1px solid var(--brd);
            padding: var(--gap-lg) 20px var(--gap-md);
            margin-top: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #footer-brand-name {
            font-size: var(--fs-lg);
            font-weight: 900;
            color: var(--acc);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #footer-brand-by {
            font-size: var(--fs-xs);
            color: var(--mut);
            font-weight: 700;
            letter-spacing: .5px;
        }

        #footer-tagline {
            font-size: var(--fs-xs);
            color: var(--mut);
            max-width: 300px;
            line-height: 1.6;
        }

        #footer-divider {
            width: 40px;
            border: none;
            border-top: 1px solid var(--brd);
        }

        #footer-mail {
            font-size: var(--fs-xs);
            color: var(--mut);
            text-decoration: none;
            transition: color .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #footer-mail:hover {
            color: var(--acc);
        }

        #footer-copy {
            font-size: var(--fs-xs);
            color: var(--brd);
        }

        /* ── RESPONSIVE ── */
        @media (min-width: 768px) {
            #page-wrapper {
                padding: 0 32px;
            }
            #page-header {
                padding: 56px 0 var(--gap-md);
            }
            #header-visual {
                width: 100px;
                height: 100px;
                font-size: 3.2rem;
            }
            #header-title {
                font-size: var(--fs-2xl);
            }
            #header-subtitle {
                font-size: var(--fs-base);
            }
            .section-heading {
                font-size: var(--fs-lg);
            }
            .example-card {
                padding: 24px 28px;
            }
            .example-card .example-phrase {
                font-size: var(--fs-lg);
            }
            .desktop-table-wrapper {
                display: block;
            }
            .mobile-cards {
                display: none;
            }
            .desktop-table th,
            .desktop-table td {
                padding: 20px 22px;
                font-size: var(--fs-base);
            }
        }

        @media (min-width: 1024px) {
            :root {
                --max-w: 800px;
            }
            #page-header {
                padding: 64px 0 var(--gap-md);
            }
            #header-title {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <nav id="top-nav">
        <a class="nav-brand" href="hub.html">Fluent</a>
        <div style="display: flex; gap: 8px;">
            <button class="nav-btn" onclick="goToPrev()" id="btn-prev" disabled>← Previous</button>
            <button class="nav-btn" onclick="goToNext()" id="btn-next" disabled>Next →</button>
        </div>
    </nav>

    <!-- floating hub button -->
    <button id="hub-fab" onclick="goToHub()" title="Back to Hub">🏠</button>

    <div id="page-wrapper">
        <header id="page-header">
            <div id="header-visual"></div>
            <div id="header-category">The Phraseosphere</div>
            <h1 id="header-title"></h1>
            <p id="header-subtitle"></p>
            <div id="header-meta"></div>
        </header>

        <main id="content-body">
            <div id="desktop-table" class="desktop-table-wrapper"></div>
            <div id="mobile-cards" class="mobile-cards"></div>
            <!-- choose topic button placed after content -->
            <section id="topic-section" style="display: none;">
                <button class="btn-topic-choose" onclick="openModal()">
                    📂 Choose Another Topic
                </button>
            </section>
        </main>
    </div>

    <!-- accordion modal -->
    <div class="modal-overlay" id="topic-modal">
        <div class="modal-content">
            <h2>Explore Topics</h2>
            <div id="accordion-container"></div>
            <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
    </div>

    <footer id="page-footer">
        <div id="footer-brand-name">Fluent</div>
        <div id="footer-brand-by">by Amrit</div>
        <p id="footer-tagline">Interactive English learning games for students of all levels.</p>
        <hr id="footer-divider">
        <a id="footer-mail" href="mailto:ilearnwithamrit@gmail.com">✉ ilearnwithamrit@gmail.com</a>
        <p id="footer-copy">© 2026 Fluent by Amrit</p>
    </footer>

    <script>
        (function() {
            const BASE_CSV =
                'https://docs.google.com/spreadsheets/d/e/2PACX-1vRf3J6Gr15efJH6zt_mEJcFf-gfjOmSYYXSAsFGJXoKZp89w3lRz72wnvRo6pwN6E_h2hdhlZb6swPc/pub?output=csv';

            let allLessons = [];
            let currentLesson = null;
            let currentIndex = -1;

            function getPlayerName() {
                if (typeof playerName !== 'undefined' && playerName) return playerName;
                return decodeURIComponent(
                    new URLSearchParams(window.location.search).get('name') || ''
                );
            }

            function getSheetParam() {
                return new URLSearchParams(window.location.search).get('sheet') || '';
            }

            function getSectionParam() {
                return new URLSearchParams(window.location.search).get('section') || '';
            }

            function goToHub() {
                const name = getPlayerName();
                window.location.href = 'hub.html' + (name ? '?name=' + encodeURIComponent(name) : '');
            }

            function goToLesson(sheetName, section = '') {
                const name = getPlayerName();
                let url = 'phraseosphere.html?sheet=' + encodeURIComponent(sheetName);
                if (section) url += '&section=' + encodeURIComponent(section);
                if (name) url += '&name=' + encodeURIComponent(name);
                window.location.href = url;
            }

            function goToNext() {
                if (currentIndex >= 0 && currentIndex < allLessons.length - 1) {
                    goToLesson(allLessons[currentIndex + 1].sheet_name);
                }
            }

            function goToPrev() {
                if (currentIndex > 0) {
                    goToLesson(allLessons[currentIndex - 1].sheet_name);
                }
            }

            function openModal() {
                document.getElementById('topic-modal').classList.add('active');
                buildAccordion();
            }

            function closeModal() {
                document.getElementById('topic-modal').classList.remove('active');
            }

            document.getElementById('topic-modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // Build accordion from allLessons (with possible sub_categories column)
            function buildAccordion() {
                const container = document.getElementById('accordion-container');
                container.innerHTML = '';
                allLessons.forEach(lesson => {
                    const item = document.createElement('div');
                    item.className = 'accordion-item';

                    const header = document.createElement('button');
                    header.className = 'accordion-header';
                    header.innerHTML = `
                        <span><span class="acc-icon">${lesson.icon || '📄'}</span> ${lesson.title}</span>
                        <span class="arrow">▶</span>
                    `;
                    header.addEventListener('click', function(e) {
                        e.stopPropagation();
                        item.classList.toggle('open');
                    });

                    const body = document.createElement('div');
                    body.className = 'accordion-body';

                    // Check for sub_categories (column index 9, after description)
                    const subCategoriesStr = lesson.sub_categories || '';
                    if (subCategoriesStr.trim()) {
                        const subs = subCategoriesStr.split(',').map(s => s.trim());
                        subs.forEach(sub => {
                            const btn = document.createElement('button');
                            btn.className = 'sub-topic-btn';
                            btn.textContent = sub;
                            btn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                closeModal();
                                // if same lesson, just scroll; else navigate
                                if (currentLesson && lesson.sheet_name === currentLesson.sheet_name) {
                                    scrollToSection(sub);
                                } else {
                                    goToLesson(lesson.sheet_name, sub);
                                }
                            });
                            body.appendChild(btn);
                        });
                    } else {
                        // No subcategories: clicking the header loads the whole lesson
                        header.addEventListener('click', function loadLesson() {
                            closeModal();
                            if (currentLesson && lesson.sheet_name === currentLesson.sheet_name) {
                                // already there, just close
                            } else {
                                goToLesson(lesson.sheet_name);
                            }
                        });
                        // also make the whole header clickable as fallback
                    }

                    item.appendChild(header);
                    item.appendChild(body);
                    container.appendChild(item);
                });
            }

            function scrollToSection(sectionName) {
                // slugify section name similarly to how we create ids
                const id = sectionName.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                const el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            function parseCSV(text) {
                const rows = [];
                const lines = text.split(/\r?\n/);
                for (const line of lines) {
                    if (!line.trim()) continue;
                    const cols = [];
                    let current = '';
                    let inQuotes = false;
                    for (const char of line) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            cols.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    cols.push(current.trim());
                    rows.push(cols);
                }
                return rows;
            }

            async function fetchCSV(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to fetch ' + url);
                const text = await res.text();
                return parseCSV(text);
            }

            async function loadIndex() {
                const rows = await fetchCSV(BASE_CSV);
                // Find header row (order, sheet_name, gid, title, format, icon, meta_visual, meta_badges, description, sub_categories)
                let headerIdx = -1;
                for (let i = 0; i < rows.length; i++) {
                    if (rows[i].length >= 7 &&
                        rows[i][0].toLowerCase().includes('order') &&
                        rows[i][1].toLowerCase().includes('sheet')) {
                        headerIdx = i;
                        break;
                    }
                }
                if (headerIdx === -1) throw new Error('_index header not found');

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r[0] || r[0].trim() === '') continue;
                    if (r.length < 7) continue;
                    allLessons.push({
                        order: parseInt(r[0].trim(), 10),
                        sheet_name: r[1].trim(),
                        gid: r[2].trim(),
                        title: r[3].trim(),
                        format: r[4].trim(),
                        icon: r[5].trim(),
                        meta_visual: r[6].trim(),
                        meta_badges: r[7] ? r[7].trim() : '',
                        description: r[8] ? r[8].trim() : '',
                        sub_categories: r[9] ? r[9].trim() : '' // new column for subcategories
                    });
                }
                allLessons.sort((a, b) => a.order - b.order);
            }

            function renderLesson(lesson, dataRows) {
                // Header
                document.getElementById('header-visual').textContent = lesson.meta_visual || '💬';
                document.getElementById('header-title').textContent = lesson.title;
                document.getElementById('header-subtitle').textContent = lesson.description || '';
                const metaDiv = document.getElementById('header-meta');
                metaDiv.innerHTML = '';
                if (lesson.meta_badges) {
                    lesson.meta_badges.split(',').forEach(b => {
                        const span = document.createElement('span');
                        span.className = 'meta-badge';
                        span.textContent = b.trim();
                        metaDiv.appendChild(span);
                    });
                }

                // Show topic section (choose button)
                document.getElementById('topic-section').style.display = 'block';

                // Group data rows by Category (column A)
                const groups = [];
                let currentGroup = null;
                for (const row of dataRows) {
                    if (row.length < 4) continue;
                    const category = row[0].trim();
                    const phrase = row[1].trim();
                    const meaning = row[2].trim();
                    const example = row[3].trim();
                    if (!category || !phrase || !meaning) continue;

                    if (!currentGroup || currentGroup.name !== category) {
                        currentGroup = { name: category, items: [] };
                        groups.push(currentGroup);
                    }
                    currentGroup.items.push({ phrase, meaning, example });
                }

                // Build desktop table
                const tableDiv = document.getElementById('desktop-table');
                tableDiv.innerHTML = '';
                if (groups.length > 0) {
                    const table = document.createElement('table');
                    table.className = 'desktop-table';
                    table.innerHTML = `
                        <thead><tr>
                            <th>Category</th><th>Phrase</th><th>Meaning</th><th>Example</th>
                        </tr></thead><tbody></tbody>`;
                    const tbody = table.querySelector('tbody');
                    groups.forEach(group => {
                        group.items.forEach((item, idx) => {
                            const tr = document.createElement('tr');
                            if (idx === 0) {
                                const tdCat = document.createElement('td');
                                tdCat.textContent = group.name;
                                tdCat.rowSpan = group.items.length;
                                tdCat.style.fontWeight = '900';
                                tdCat.style.color = 'var(--txt)';
                                tdCat.style.verticalAlign = 'top';
                                tr.appendChild(tdCat);
                            }
                            const tdPhrase = document.createElement('td');
                            tdPhrase.className = 'phrase-cell';
                            tdPhrase.textContent = item.phrase;
                            const tdMeaning = document.createElement('td');
                            tdMeaning.innerHTML = formatMeaning(item.meaning);
                            const tdExample = document.createElement('td');
                            tdExample.textContent = item.example;
                            tdExample.style.fontStyle = 'italic';
                            tdExample.style.color = 'var(--ex-usage)';
                            tr.appendChild(tdPhrase);
                            tr.appendChild(tdMeaning);
                            tr.appendChild(tdExample);
                            tbody.appendChild(tr);
                        });
                    });
                    tableDiv.appendChild(table);
                }

                // Build mobile cards with section headings and ids
                const mobileDiv = document.getElementById('mobile-cards');
                mobileDiv.innerHTML = '';
                groups.forEach(group => {
                    const section = document.createElement('section');
                    section.className = 'content-section';
                    const slug = group.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
                    section.innerHTML = `
                        <h2 class="section-heading" id="${slug}">
                            <span class="section-icon">📌</span> ${group.name}
                        </h2>`;
                    group.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'example-card';
                        card.innerHTML = `
                            <div class="example-phrase">${item.phrase}</div>
                            <div class="example-meaning">${formatMeaning(item.meaning)}</div>
                            <div class="example-usage">"${item.example}"</div>`;
                        section.appendChild(card);
                    });
                    mobileDiv.appendChild(section);
                });

                // After rendering, check for section param and scroll to it
                const sectionParam = getSectionParam();
                if (sectionParam) {
                    setTimeout(() => scrollToSection(sectionParam), 300);
                }
            }

            function formatMeaning(text) {
                // Bengali part in brackets styled green
                return text.replace(/\(([^)]+)\)/g,
                    '<span class="example-bengali">($1)</span>'
                );
            }

            function updateNavButtons() {
                const prevBtn = document.getElementById('btn-prev');
                const nextBtn = document.getElementById('btn-next');
                prevBtn.disabled = currentIndex <= 0;
                nextBtn.disabled = currentIndex >= allLessons.length - 1;
            }

            async function init() {
                try {
                    await loadIndex();
                    const sheetName = getSheetParam();
                    if (!sheetName && allLessons.length > 0) {
                        goToLesson(allLessons[0].sheet_name);
                        return;
                    }

                    currentLesson = allLessons.find(l => l.sheet_name === sheetName);
                    if (!currentLesson) {
                        document.getElementById('header-title').textContent = 'Lesson not found';
                        return;
                    }
                    currentIndex = allLessons.indexOf(currentLesson);
                    updateNavButtons();

                    const gid = currentLesson.gid;
                    const csvUrl =
                        `https://docs.google.com/spreadsheets/d/e/2PACX-1vRf3J6Gr15efJH6zt_mEJcFf-gfjOmSYYXSAsFGJXoKZp89w3lRz72wnvRo6pwN6E_h2hdhlZb6swPc/pub?gid=${gid}&single=true&output=csv`;
                    const dataRows = await fetchCSV(csvUrl);
                    renderLesson(currentLesson, dataRows);

                } catch (err) {
                    console.error(err);
                    document.getElementById('header-title').textContent = 'Error loading lesson';
                }
            }

            window.goToHub = goToHub;
            window.goToNext = goToNext;
            window.goToPrev = goToPrev;
            window.openModal = openModal;
            window.closeModal = closeModal;

            init();
        })();
    </script>
</body>
</html>
