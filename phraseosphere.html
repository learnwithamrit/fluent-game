<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The Phraseosphere — Fluent by Amrit</title>
    <meta name="description" content="Master English idioms with clear meanings and real‑life examples.">
    <meta property="og:title" content="The Phraseosphere — Fluent by Amrit">
    <meta property="og:description" content="Master English idioms with clear meanings and real‑life examples.">
    <meta property="og:type" content="article">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
    <meta name="theme-color" content="#ff8906">

    <style>
        :root {
            --bg: #0d0d1a;
            --sur: #161628;
            --sur2: #1e1e38;
            --brd: #2e2e52;
            --txt: #e8e8f0;
            --mut: #7070a0;
            --acc: #ff8906;
            --ac2: #f9c74f;
            --grn: #06d6a0;
            --blu: #3da9fc;
            --red: #ef4565;
            --fs-xs: 0.62rem;
            --fs-sm: 0.78rem;
            --fs-base: 0.95rem;
            --fs-md: 1.1rem;
            --fs-lg: 1.4rem;
            --fs-xl: 1.9rem;
            --fs-2xl: 2.4rem;
            --gap-sm: 12px;
            --gap-md: 24px;
            --gap-lg: 48px;
            --max-w: 740px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--txt);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: var(--fs-base);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #top-nav {
            width: 100%;
            background: var(--sur);
            border-bottom: 1px solid var(--brd);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 8px;
            flex-wrap: wrap;
        }

        #top-nav .nav-brand {
            font-size: var(--fs-sm);
            font-weight: 900;
            color: var(--acc);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-btn {
            background: var(--sur2);
            border: 1.5px solid var(--brd);
            color: var(--mut);
            border-radius: 8px;
            padding: 7px 14px;
            font-size: var(--fs-xs);
            font-weight: 800;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: .3px;
            font-family: inherit;
            white-space: nowrap;
        }

        .nav-btn:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        #page-wrapper {
            width: 100%;
            max-width: var(--max-w);
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #page-header {
            padding: var(--gap-lg) 0 var(--gap-md);
            text-align: center;
            border-bottom: 1px solid var(--brd);
            margin-bottom: var(--gap-lg);
        }

        #header-visual {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            background: var(--sur);
            border: 2px solid var(--brd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            margin: 0 auto var(--gap-md);
            box-shadow: 0 8px 32px #00000044;
        }

        #header-category {
            font-size: var(--fs-xs);
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--acc);
            background: #ff890614;
            border: 1px solid #ff890633;
            border-radius: 20px;
            padding: 4px 14px;
            display: inline-block;
            margin-bottom: var(--gap-sm);
        }

        #header-title {
            font-size: var(--fs-xl);
            font-weight: 900;
            color: var(--txt);
            line-height: 1.2;
            letter-spacing: -.5px;
            margin-bottom: 10px;
        }

        #header-subtitle {
            font-size: var(--fs-sm);
            color: var(--mut);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }

        #header-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: var(--gap-md);
            flex-wrap: wrap;
        }

        .meta-badge {
            font-size: var(--fs-xs);
            color: var(--mut);
            background: var(--sur);
            border: 1px solid var(--brd);
            border-radius: 20px;
            padding: 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        #content-body {
            flex: 1;
            padding-bottom: var(--gap-lg);
        }

        .content-section {
            margin-bottom: var(--gap-lg);
        }

        .section-heading {
            font-size: var(--fs-md);
            font-weight: 900;
            color: var(--txt);
            margin-bottom: var(--gap-sm);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--brd);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-heading .section-icon {
            font-size: 1.1rem;
        }

        .example-card {
            background: var(--sur);
            border: 1.5px solid var(--brd);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: var(--gap-sm);
            transition: border-color .2s;
        }

        .example-card:hover {
            border-color: var(--acc);
        }

        .example-card .example-phrase {
            font-size: var(--fs-md);
            font-weight: 900;
            color: var(--acc);
            margin-bottom: 6px;
        }

        .example-card .example-meaning {
            font-size: var(--fs-sm);
            color: var(--txt);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .example-card .example-usage {
            font-size: var(--fs-sm);
            color: var(--mut);
            font-style: italic;
            border-left: 3px solid var(--acc);
            padding-left: 12px;
            line-height: 1.6;
        }

        .example-card .example-bengali {
            font-size: var(--fs-xs);
            color: var(--grn);
            margin-top: 8px;
            font-weight: 700;
        }

        /* Desktop table */
        .desktop-table-wrapper {
            display: none;
            overflow-x: auto;
            margin-bottom: var(--gap-md);
        }

        .desktop-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-sm);
            background: var(--sur);
            border: 1.5px solid var(--brd);
            border-radius: 16px;
            overflow: hidden;
        }

        .desktop-table th {
            background: var(--sur2);
            color: var(--txt);
            font-weight: 900;
            padding: 16px 18px;
            text-align: left;
            border-bottom: 2px solid var(--brd);
            font-size: var(--fs-sm);
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .desktop-table td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--brd);
            color: var(--mut);
            vertical-align: top;
            line-height: 1.7;
        }

        .desktop-table tr:last-child td {
            border-bottom: none;
        }

        .desktop-table .phrase-cell {
            color: var(--acc);
            font-weight: 900;
            font-size: var(--fs-base);
        }

        .mobile-cards {
            display: block;
        }

        .pull-quote {
            border-left: 4px solid var(--acc);
            padding: 12px 18px;
            margin: var(--gap-md) 0;
            background: var(--sur);
            border-radius: 0 12px 12px 0;
        }

        .pull-quote p {
            font-size: var(--fs-md);
            color: var(--txt);
            font-style: italic;
            font-weight: 600;
        }

        .cta-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: var(--gap-md);
            justify-content: center;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--acc);
            color: #0d0d1a;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: var(--fs-sm);
            font-weight: 900;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
            font-family: inherit;
            letter-spacing: .3px;
        }

        .cta-btn:hover {
            background: #ffaa30;
            transform: translateY(-2px);
        }

        .cta-btn.secondary {
            background: var(--sur2);
            color: var(--txt);
            border: 1.5px solid var(--brd);
        }

        .cta-btn.secondary:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--sur);
            border: 1.5px solid var(--brd);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px #000000aa;
        }

        .modal-content h2 {
            font-size: var(--fs-lg);
            font-weight: 900;
            color: var(--txt);
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-list li button {
            width: 100%;
            background: var(--sur2);
            border: 1.5px solid var(--brd);
            color: var(--txt);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: var(--fs-base);
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: inherit;
        }

        .modal-list li button:hover {
            border-color: var(--acc);
            background: #ff890612;
        }

        .modal-list .topic-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .modal-close {
            display: block;
            margin: 24px auto 0;
            background: transparent;
            border: 1.5px solid var(--brd);
            color: var(--mut);
            border-radius: 10px;
            padding: 10px 24px;
            font-size: var(--fs-sm);
            font-weight: 800;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }

        .modal-close:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        #page-footer {
            width: 100%;
            background: var(--sur);
            border-top: 1px solid var(--brd);
            padding: var(--gap-lg) 20px var(--gap-md);
            margin-top: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #footer-brand-name {
            font-size: var(--fs-lg);
            font-weight: 900;
            color: var(--acc);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #footer-brand-by {
            font-size: var(--fs-xs);
            color: var(--mut);
            font-weight: 700;
            letter-spacing: .5px;
        }

        #footer-tagline {
            font-size: var(--fs-xs);
            color: var(--mut);
            max-width: 280px;
            line-height: 1.6;
        }

        #footer-divider {
            width: 40px;
            border: none;
            border-top: 1px solid var(--brd);
        }

        #footer-mail {
            font-size: var(--fs-xs);
            color: var(--mut);
            text-decoration: none;
            transition: color .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #footer-mail:hover {
            color: var(--acc);
        }

        #footer-copy {
            font-size: var(--fs-xs);
            color: var(--brd);
        }

        @media (min-width: 768px) {
            #page-wrapper {
                padding: 0 32px;
            }
            #page-header {
                padding: 56px 0 var(--gap-md);
            }
            #header-visual {
                width: 100px;
                height: 100px;
                font-size: 3.2rem;
            }
            #header-title {
                font-size: var(--fs-2xl);
            }
            #header-subtitle {
                font-size: var(--fs-base);
            }
            .section-heading {
                font-size: var(--fs-lg);
            }
            .example-card {
                padding: 22px 24px;
            }
            .example-card .example-phrase {
                font-size: var(--fs-lg);
            }
            .desktop-table-wrapper {
                display: block;
            }
            .mobile-cards {
                display: none;
            }
        }

        @media (min-width: 1024px) {
            :root {
                --max-w: 780px;
            }
            #page-header {
                padding: 64px 0 var(--gap-md);
            }
            #header-title {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>

    <nav id="top-nav">
        <a class="nav-brand" href="hub.html">Fluent</a>
        <button class="nav-btn" onclick="goToPrev()" id="btn-prev" disabled>← Previous</button>
        <button class="nav-btn" onclick="goToNext()" id="btn-next" disabled>Next →</button>
        <button class="nav-btn" onclick="openModal()">📂 Topics</button>
        <button class="nav-btn" onclick="goToHub()">🏠 Hub</button>
    </nav>

    <div id="page-wrapper">
        <header id="page-header">
            <div id="header-visual"></div>
            <div id="header-category">The Phraseosphere</div>
            <h1 id="header-title"></h1>
            <p id="header-subtitle"></p>
            <div id="header-meta"></div>
        </header>

        <main id="content-body">
            <div id="desktop-table" class="desktop-table-wrapper"></div>
            <div id="mobile-cards" class="mobile-cards"></div>
        </main>
    </div>

    <div class="modal-overlay" id="topic-modal">
        <div class="modal-content">
            <h2>Choose a Topic</h2>
            <ul class="modal-list" id="modal-list"></ul>
            <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
    </div>

    <footer id="page-footer">
        <div id="footer-brand-name">Fluent</div>
        <div id="footer-brand-by">by Amrit</div>
        <p id="footer-tagline">Interactive English learning games for students of all levels.</p>
        <hr id="footer-divider">
        <a id="footer-mail" href="mailto:ilearnwithamrit@gmail.com">✉ ilearnwithamrit@gmail.com</a>
        <p id="footer-copy">© 2026 Fluent by Amrit</p>
    </footer>

    <script>
        (function() {
            const BASE_CSV =
                'https://docs.google.com/spreadsheets/d/e/2PACX-1vRf3J6Gr15efJH6zt_mEJcFf-gfjOmSYYXSAsFGJXoKZp89w3lRz72wnvRo6pwN6E_h2hdhlZb6swPc/pub?output=csv';

            let allLessons = [];
            let currentLesson = null;
            let currentIndex = -1;

            function getPlayerName() {
                if (typeof playerName !== 'undefined' && playerName) return playerName;
                return decodeURIComponent(
                    new URLSearchParams(window.location.search).get('name') || ''
                );
            }

            function getSheetParam() {
                return new URLSearchParams(window.location.search).get('sheet') || '';
            }

            function goToHub() {
                const name = getPlayerName();
                window.location.href = 'hub.html' + (name ? '?name=' + encodeURIComponent(name) : '');
            }

            function goToLesson(sheetName) {
                const name = getPlayerName();
                window.location.href = 'phraseosphere.html?sheet=' + encodeURIComponent(sheetName) +
                    (name ? '&name=' + encodeURIComponent(name) : '');
            }

            function goToNext() {
                if (currentIndex >= 0 && currentIndex < allLessons.length - 1) {
                    goToLesson(allLessons[currentIndex + 1].sheet_name);
                }
            }

            function goToPrev() {
                if (currentIndex > 0) {
                    goToLesson(allLessons[currentIndex - 1].sheet_name);
                }
            }

            function openModal() {
                document.getElementById('topic-modal').classList.add('active');
                buildModalList();
            }

            function closeModal() {
                document.getElementById('topic-modal').classList.remove('active');
            }

            document.getElementById('topic-modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            function buildModalList() {
                const list = document.getElementById('modal-list');
                list.innerHTML = '';
                allLessons.forEach(lesson => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.innerHTML =
                        `<span class="topic-icon">${lesson.icon||'📄'}</span> ${lesson.title}`;
                    btn.addEventListener('click', () => {
                        closeModal();
                        goToLesson(lesson.sheet_name);
                    });
                    li.appendChild(btn);
                    list.appendChild(li);
                });
            }

            function parseCSV(text) {
                const rows = [];
                const lines = text.split(/\r?\n/);
                for (const line of lines) {
                    if (!line.trim()) continue;
                    const cols = [];
                    let current = '';
                    let inQuotes = false;
                    for (const char of line) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            cols.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    cols.push(current.trim());
                    rows.push(cols);
                }
                return rows;
            }

            async function fetchCSV(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to fetch ' + url);
                const text = await res.text();
                return parseCSV(text);
            }

            async function loadIndex() {
                const rows = await fetchCSV(BASE_CSV);
                // Find header row
                let headerIdx = -1;
                for (let i = 0; i < rows.length; i++) {
                    if (rows[i].length >= 7 &&
                        rows[i][0].toLowerCase().includes('order') &&
                        rows[i][1].toLowerCase().includes('sheet')) {
                        headerIdx = i;
                        break;
                    }
                }
                if (headerIdx === -1) throw new Error('_index header not found');

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r[0] || r[0].trim() === '') continue;
                    if (r.length < 7) continue;
                    allLessons.push({
                        order: parseInt(r[0].trim(), 10),
                        sheet_name: r[1].trim(),
                        gid: r[2].trim(),
                        title: r[3].trim(),
                        format: r[4].trim(),
                        icon: r[5].trim(),
                        meta_visual: r[6].trim(),
                        meta_badges: r[7] ? r[7].trim() : '',
                        description: r[8] ? r[8].trim() : ''
                    });
                }
                allLessons.sort((a, b) => a.order - b.order);
            }

            function renderLesson(lesson, dataRows) {
                // Header
                document.getElementById('header-visual').textContent = lesson.meta_visual || '💬';
                document.getElementById('header-title').textContent = lesson.title;
                document.getElementById('header-subtitle').textContent = lesson.description || '';
                const metaDiv = document.getElementById('header-meta');
                metaDiv.innerHTML = '';
                if (lesson.meta_badges) {
                    lesson.meta_badges.split(',').forEach(b => {
                        const span = document.createElement('span');
                        span.className = 'meta-badge';
                        span.textContent = b.trim();
                        metaDiv.appendChild(span);
                    });
                }

                // Parse data rows into groups
                const groups = [];
                let currentGroup = null;
                for (const row of dataRows) {
                    if (row.length < 4) continue;
                    const category = row[0].trim();
                    const phrase = row[1].trim();
                    const meaning = row[2].trim();
                    const example = row[3].trim();
                    if (!category || !phrase || !meaning) continue;

                    if (!currentGroup || currentGroup.name !== category) {
                        currentGroup = { name: category, items: [] };
                        groups.push(currentGroup);
                    }
                    currentGroup.items.push({ phrase, meaning, example });
                }

                // Build desktop table
                const tableDiv = document.getElementById('desktop-table');
                tableDiv.innerHTML = '';
                if (groups.length > 0) {
                    const table = document.createElement('table');
                    table.className = 'desktop-table';
                    table.innerHTML = `
                        <thead><tr>
                            <th>Category</th><th>Phrase</th><th>Meaning</th><th>Example</th>
                        </tr></thead><tbody></tbody>`;
                    const tbody = table.querySelector('tbody');
                    groups.forEach(group => {
                        group.items.forEach((item, idx) => {
                            const tr = document.createElement('tr');
                            if (idx === 0) {
                                const tdCat = document.createElement('td');
                                tdCat.textContent = group.name;
                                tdCat.rowSpan = group.items.length;
                                tdCat.style.fontWeight = '900';
                                tdCat.style.color = 'var(--txt)';
                                tdCat.style.verticalAlign = 'top';
                                tr.appendChild(tdCat);
                            }
                            const tdPhrase = document.createElement('td');
                            tdPhrase.className = 'phrase-cell';
                            tdPhrase.textContent = item.phrase;
                            const tdMeaning = document.createElement('td');
                            tdMeaning.innerHTML = formatMeaning(item.meaning);
                            const tdExample = document.createElement('td');
                            tdExample.textContent = item.example;
                            tdExample.style.fontStyle = 'italic';
                            tr.appendChild(tdPhrase);
                            tr.appendChild(tdMeaning);
                            tr.appendChild(tdExample);
                            tbody.appendChild(tr);
                        });
                    });
                    tableDiv.appendChild(table);
                }

                // Build mobile cards
                const mobileDiv = document.getElementById('mobile-cards');
                mobileDiv.innerHTML = '';
                groups.forEach(group => {
                    const section = document.createElement('section');
                    section.className = 'content-section';
                    section.innerHTML = `
                        <h2 class="section-heading">
                            <span class="section-icon">📌</span> ${group.name}
                        </h2>`;
                    group.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'example-card';
                        card.innerHTML = `
                            <div class="example-phrase">${item.phrase}</div>
                            <div class="example-meaning">${formatMeaning(item.meaning)}</div>
                            <div class="example-usage">"${item.example}"</div>`;
                        section.appendChild(card);
                    });
                    mobileDiv.appendChild(section);
                });
            }

            function formatMeaning(text) {
                // Replace Bengali in brackets with styled span
                return text.replace(/\(([^)]+)\)/g,
                    '<span class="example-bengali" style="display:inline;font-size:var(--fs-xs);color:var(--grn);font-weight:700;">($1)</span>'
                    );
            }

            function updateNavButtons() {
                const prevBtn = document.getElementById('btn-prev');
                const nextBtn = document.getElementById('btn-next');
                prevBtn.disabled = currentIndex <= 0;
                nextBtn.disabled = currentIndex >= allLessons.length - 1;
            }

            async function init() {
                try {
                    await loadIndex();
                    const sheetName = getSheetParam();
                    if (!sheetName && allLessons.length > 0) {
                        goToLesson(allLessons[0].sheet_name);
                        return;
                    }

                    currentLesson = allLessons.find(l => l.sheet_name === sheetName);
                    if (!currentLesson) {
                        document.getElementById('header-title').textContent = 'Lesson not found';
                        return;
                    }
                    currentIndex = allLessons.indexOf(currentLesson);
                    updateNavButtons();

                    const gid = currentLesson.gid;
                    const csvUrl =
                        `https://docs.google.com/spreadsheets/d/e/2PACX-1vRf3J6Gr15efJH6zt_mEJcFf-gfjOmSYYXSAsFGJXoKZp89w3lRz72wnvRo6pwN6E_h2hdhlZb6swPc/pub?gid=${gid}&single=true&output=csv`;
                    const dataRows = await fetchCSV(csvUrl);
                    renderLesson(currentLesson, dataRows);

                } catch (err) {
                    console.error(err);
                    document.getElementById('header-title').textContent = 'Error loading lesson';
                }
            }

            window.goToHub = goToHub;
            window.goToNext = goToNext;
            window.goToPrev = goToPrev;
            window.openModal = openModal;
            window.closeModal = closeModal;

            init();
        })();
    </script>
</body>
</html>
