    :root {
      --bg-deep: #121212;
      --card-bg: #1e1e1e;
      --accent: #6366f1;
      --success: #10b981;
      --error: #ef4444;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --card-radius: 20px;
      --btn-radius: 14px;
      --transition-speed: 0.3s;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #0a0a0a;
      font-family: var(--font-sans);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      overflow: hidden;
    }

    /* App container – full screen on mobile, centered card on larger screens */
    .app-container {
      width: 100%;
      height: 100%;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: none;
      border-radius: 0;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Tablet and larger */
    @media (min-width: 500px) {
      body {
        padding: 16px;
      }
      .app-container {
        max-width: 540px;
        height: auto;
        min-height: 85vh;
        max-height: 95vh;
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
    }

    @media (min-width: 768px) {
      .app-container {
        max-width: 620px;
        min-height: 80vh;
        max-height: 92vh;
        border-radius: 36px;
      }
    }

    @media (min-width: 1024px) {
      body {
        padding: 24px;
      }
      .app-container {
        max-width: 720px;
        min-height: 75vh;
        max-height: 90vh;
        border-radius: 40px;

    /* ============ HEADER ============ */
    .global-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: nowrap;
      min-height: 54px;
    }
    .header-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .header-item .icon {
      font-size: 0.9rem;
      line-height: 1;
    }
    .header-item .value {
      color: var(--text-primary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }
    .header-item.score-item {
      transition: opacity 0.4s;
    }
    .header-item.score-item.muted {
      opacity: 0.35;
    }
    .header-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      border-radius: 1px;
    }

    @media (max-width: 380px) {

        min-height: 50px;

        font-size: 0.66rem;
        gap: 3px;

      .header-item .value {
        font-size: 0.7rem;
      }
      .header-item .icon {
        font-size: 0.8rem;
      }
      .header-divider {
        height: 16px;

    @media (min-width: 500px) {

      .header-item .value {
        font-size: 0.85rem;
      }
      .header-item .icon {
        font-size: 1rem;
      }

    @media (min-width: 500px) {

      letter-spacing: -0.02em;
      line-height: 1.2;

      text-align: left;
      font-weight: 600;
      letter-spacing: 0.02em;

    .hub-input {

      font-family: var(--font-sans);

      transition: border-color 0.2s;
      width: 100%;

    .hub-input:focus {
      border-color: var(--accent);

    @media (min-width: 500px) {
      .hub-title {
        font-size: 2.2rem;
      }
      .hub-subtitle {
        font-size: 1rem;
      }

        max-width: 360px;

    /* ============ BUTTONS ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: var(--btn-radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: var(--font-sans);
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
      filter: brightness(1.08);
    }
    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .btn-outline:hover {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.04);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-ghost:hover {
      color: var(--text-primary);
    }
    .btn-danger-zone {
      background: transparent;
      border: 2px solid var(--error);
      color: var(--error);
      font-weight: 600;
    }
    .btn-danger-zone:hover {
      background: rgba(239, 68, 68, 0.1);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
    }
    .btn-full {
      width: 100%;
      max-width: 360px;
    }
    .btn-lg {
      padding: 16px 32px;
      font-size: 1.1rem;
      border-radius: 18px;
    }

    @media (max-width: 380px) {
      .btn {
        padding: 12px 18px;
        font-size: 0.9rem;
      }
    }

    @media (min-width: 500px) {
      .btn {
        padding: 15px 28px;
        font-size: 1rem;
      }
      .btn-lg {
        padding: 18px 36px;
        font-size: 1.2rem;
      }
    }

    /* ============ CARD ============ */
    .card-stage {
      perspective: 1000px;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1.6 / 1;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
       will-change: transform;
    }
    .card-wrapper {
  overflow: hidden;
  width: 100%;
  max-width: 380px;   /* same as card-stage max-width */
  position: relative;
}



 .text-input-area {
  margin-top: 8px;
}
#quizTextInput {
  text-align: center;
  font-size: 1rem;
}

    .card-inner {
      width: 100%;
      height: 100%;

    .card-inner.flipped {
      transform: rotateY(180deg);

      position: absolute;
      inset: 0;
      backface-visibility: hidden;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: var(--card-bg);

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .card-front {
      z-index: 2;
    }
    .card-back {
      transform: rotateY(180deg);
      z-index: 1;
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.15);

    .card-bengali {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.5;

    @media (max-width: 380px) {

    @media (min-width: 500px) {
      .card-stage {

        font-size: 1.6rem;
      }
      .card-english {
        font-size: 1.3rem;
      }
      .card-hint {
        font-size: 0.8rem;
      }
    }

    @media (min-width: 768px) {
      .card-stage {
        max-width: 480px;
      }
      .card-bengali {
        font-size: 1.8rem;
      }
      .card-english {
        font-size: 1.45rem;
      }
    }

    .swipe-indicator {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-secondary);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      opacity: 0.55;
      pointer-events: none;
      text-transform: uppercase;
    }
    .swipe-indicator span {
      font-size: 1.1rem;
    }
    .nav-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ============ QUIZ OPTIONS ============ */
    .quiz-question-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 18px 22px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 420px;
    }
    .quiz-bengali {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }
    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--btn-radius);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-family: var(--font-sans);
      letter-spacing: 0.01em;
      min-height: 54px;
    }
    .option-btn .opt-label {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.85rem;
      min-width: 24px;
      text-align: center;
    }

    @media (max-width: 380px) {
      .quiz-bengali {
        font-size: 1.1rem;
      }
      .option-btn {
        padding: 12px 14px;
        font-size: 0.85rem;
        min-height: 50px;
      }
    }

    @media (min-width: 500px) {
      .quiz-bengali {
        font-size: 1.5rem;
      }
      .option-btn {
        font-size: 1rem;
        padding: 16px 20px;
        min-height: 58px;
      }
      .options-list {
        gap: 12px;
      }
    }

    .option-btn.correct-flash {
      border-color: var(--success) !important;
      background: rgba(16, 185, 129, 0.15) !important;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.4);
      animation: pulse-success 0.5s ease-out;
    }
    .option-btn.wrong-flash {
      border-color: var(--error) !important;
      background: rgba(239, 68, 68, 0.15) !important;
      animation: shake 0.4s ease;
    }
    @keyframes pulse-success {
      0%, 100% { box-shadow: 0 0 8px rgba(16,185,129,0.3); }
      50% { box-shadow: 0 0 28px rgba(16,185,129,0.7); }
    }
    @keyframes shake {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-6px);}
      40%{transform:translateX(6px);}
      60%{transform:translateX(-4px);}
      80%{transform:translateX(4px);}
    }

    /* ============ MODAL ============ */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);

      z-index: 50;
      animation: fadeIn 0.25s ease;
      border-radius: inherit;

    @media (min-width: 500px) {

  <script>
    (function() {
     const CONFIG = {
  cardsPerSession: 10,
  googleSheetCSVUrl: 'https://docs.google.com/spreadsheets/d/e/.../pub?output=csv',   // ← NEW URL
  fallbackData: [
    {
      bengali: ['বিরক্ত / ক্লান্ত'],
      english: ['Sick and tired', 'Fed up'],
      quizQuestion: 'আমি অপেক্ষা করতে করতে বিরক্ত হয়ে গেছি।',
      quizAnswers: ["I'm sick and tired of waiting", 'I am fed up with waiting']
    },
    {
      bengali: ['সবাই জানে / সবার জানা'],

async function loadProverbData() {
  if (CONFIG.googleSheetCSVUrl && CONFIG.googleSheetCSVUrl.trim() !== '') {
    try {
      console.log('📡 Fetching Google Sheet…');
      const res = await fetch(CONFIG.googleSheetCSVUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      const csv = await res.text();
      console.log('📄 CSV received, first 150 chars:', csv.substring(0, 150));

      const parsed = parseCSV(csv);
      console.log('🔢 Parsed rows:', parsed.length);

      // Skip header row if present (robust check)
      if (parsed.length > 0) {
        const firstRow = parsed[0];
        // Safely get the first Bengali value, whether object or array
        let firstCell = undefined;
        if (firstRow.bengali) {
          firstCell = firstRow.bengali[0];
        } else if (Array.isArray(firstRow)) {
          firstCell = firstRow[0];
        }
        if (firstCell && firstCell.toLowerCase() === 'bengali') {
          console.log('⚠️ Header row detected, removing.');
          parsed.shift();
          console.log('🔢 Rows after header removal:', parsed.length);
        }
      }

      if (parsed.length >= CONFIG.cardsPerSession) {
        state.allProverbs = parsed;
        state.remainingPool = [...parsed]; 
        console.log(`✅ Loaded ${parsed.length} proverbs from Google Sheets`);
        return;
      } else {
        console.warn(`⚠️ Not enough proverbs (got ${parsed.length}, need ${CONFIG.cardsPerSession}). Falling back.`);
      }
    } catch (e) {
      console.warn('❌ Google Sheet fetch failed:', e.message);
    }
  }

  // Fallback – use built‑in data (object format)
  console.log('🔄 Using fallback data.');
  state.allProverbs = CONFIG.fallbackData.map(item => ({
    bengali: [...item.bengali],
    english: [...item.english],
    distractors: [...item.distractors]
  })); state.remainingPool = [...state.allProverbs]; 
}
function parseCSV(txt) {
  const rows = [];
  const lines = txt.trim().split(/\r?\n/);
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && i + 1 < line.length && line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cols.push(cur.trim());

    if (cols.length >= 4) {   // we only need 4 columns
      const bengali = cols[0].split(';').map(s => s.trim()).filter(Boolean);
      const english = cols[1].split(';').map(s => s.trim()).filter(Boolean);
      const quizQuestion = cols[2].trim();
      const quizAnswers = cols[3].split(';').map(s => s.trim()).filter(Boolean);
      rows.push({
        bengali: bengali.length ? bengali : [cols[0]],
        english: english.length ? english : [cols[1]],
        quizQuestion: quizQuestion || '',
        quizAnswers: quizAnswers.length ? quizAnswers : [cols[3]]
      });
    }
  }
  return rows;
}


function selectSessionProverbs() {
  // If not enough left, refill the pool
  if (state.remainingPool.length < CONFIG.cardsPerSession) {
    state.remainingPool = [...state.allProverbs];
  }

  // Shuffle the remaining pool
  const shuffled = [...state.remainingPool];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  // Take the first 10 and remove them from the pool
  state.sessionProverbs = shuffled.slice(0, CONFIG.cardsPerSession);
  state.remainingPool = shuffled.slice(CONFIG.cardsPerSession);

  // Reset session state
  state.currentCardIndex = 0;
  state.isFlipped = false;
  state.score = 0;
  state.currentQuizIndex = 0;
  state.quizOrder = [];
  state.timerSeconds = 0;
  updateTimerDisplay();
  updateHeaderScore();
  updateHeaderCardIndex();
}

      function attachCardListeners(){
        const card=document.getElementById('cardStage'); if(!card) return;
        card.addEventListener('pointerdown', onPointerDown); card.addEventListener('pointermove', onPointerMove);
        card.addEventListener('pointerup', onPointerUp); card.addEventListener('pointercancel', onPointerCancel);
        card.addEventListener('pointerleave', onPointerCancel);
        card.addEventListener('touchstart',e=>{ if(e.target.closest('.card-stage')) e.preventDefault(); },{passive:false});
      }
      function onPointerDown(e){ state.swipeStartX=e.clientX; state.swipeStartY=e.clientY; state.swipeMoved=false; state.swipeDistanceX=0; state.isSwiping=true; e.target.setPointerCapture(e.pointerId); }
      function onPointerMove(e){ if(!state.isSwiping) return; const dx=e.clientX-state.swipeStartX, dy=e.clientY-state.swipeStartY; state.swipeDistanceX=dx; if(Math.abs(dx)>8||Math.abs(dy)>8) state.swipeMoved=true; }
      function onPointerUp(e){
        if(!state.isSwiping) return; state.isSwiping=false;
        const absDx=Math.abs(state.swipeDistanceX), absDy=Math.abs(e.clientY-state.swipeStartY);
        if(state.swipeMoved && absDx>50 && absDx>absDy*1.5){ if(state.swipeDistanceX<-40) navigateCard(1); else if(state.swipeDistanceX>40) navigateCard(-1); }
        else if(!state.swipeMoved || (absDx<15 && absDy<15)) flipCard();
        state.swipeDistanceX=0; state.swipeMoved=false; try{e.target.releasePointerCapture(e.pointerId);}catch(ex){}
      }
      function onPointerCancel(e){ state.isSwiping=false; state.swipeDistanceX=0; state.swipeMoved=false; try{e.target.releasePointerCapture(e.pointerId);}catch(ex){} }
      function flipCard(){  if (state.phase !== 'learning' || state.isAnimating) return;  const inner=document.getElementById('cardInner'); if(!inner) return; state.isFlipped=!state.isFlipped; inner.classList.toggle('flipped', state.isFlipped); }


function navigateCard(direction) {
  if (state.phase !== 'learning' || state.isAnimating) return;
  const newIndex = state.currentCardIndex + direction;
  if (newIndex < 0) return;
  if (newIndex >= state.totalInSession) {
    finishSessionAndStartQuiz();
    return;
  }

  state.isAnimating = true;
  const cardStage = document.getElementById('cardStage');
  if (!cardStage) {
    state.isAnimating = false;
    return;
  }

  // Determine slide-out direction: next (1) → left, previous (-1) → right
  const exitTranslate = direction > 0 ? '-120%' : '120%';
  const enterTranslate = direction > 0 ? '120%' : '-120%';

  // Slide current card out
  cardStage.style.transition = 'transform 0.3s ease';
  cardStage.style.transform = `translateX(${exitTranslate})`;

  let animating = true;

  const finishAnimation = () => {
    if (!animating) return;
    animating = false;

    // Update the proverb index and header
    state.currentCardIndex = newIndex;
    updateHeaderCardIndex();

    // Update the card content (text)
    updateCardContent();

    // Jump the card to the opposite side instantly
    cardStage.style.transition = 'none';
    cardStage.style.transform = `translateX(${enterTranslate})`;
    cardStage.offsetHeight; // force reflow

    // Animate back to center
    cardStage.style.transition = 'transform 0.3s ease';
    cardStage.style.transform = 'translateX(0)';

    // Unlock after enter animation completes (with timeout fallback)
    const unlock = () => {
      state.isAnimating = false;
    };
    cardStage.addEventListener('transitionend', unlock, { once: true });
    setTimeout(unlock, 350);
  };

  // Wait for exit slide to finish
  cardStage.addEventListener('transitionend', finishAnimation, { once: true });
  setTimeout(finishAnimation, 350); // safety net
}


      

function updateCardContent() {
  const proverb = state.sessionProverbs[state.currentCardIndex];

      function finishSessionAndStartQuiz(){

function handleQuizSubmit() {
  const inputField = document.getElementById('quizTextInput');
  if (!inputField) return;
  const userAnswer = inputField.value.trim();
  if (userAnswer === '') return;   // ignore empty submissions

  // Prevent multiple submissions
  document.getElementById('btnSubmitAnswer').disabled = true;
  inputField.disabled = true;

  const proverb = state.sessionProverbs[state.quizOrder[state.currentQuizIndex]];
  const correctAnswers = proverb.quizAnswers.map(a => a.toLowerCase());

  const isCorrect = correctAnswers.includes(userAnswer.toLowerCase());

  if (isCorrect) {
    state.score++;
    updateHeaderScore();
    // Show brief success
    inputField.style.borderColor = 'var(--success)';
    setTimeout(() => {
      state.currentQuizIndex++;
      if (state.currentQuizIndex >= state.totalInSession) finishQuiz();
      else renderQuizQuestion();
    }, 800);
  } else {
    // Wrong answer – pause timer, show modal
    pauseTimer();
    showErrorModal(proverb);
  }
}

  headerCardIndex.textContent = `--/${state.totalInSession}`;
  headerScoreItem.classList.add('muted');
  headerScore.textContent = `--/${state.totalInSession}`;
  updateTimerDisplay();

  mainContent.innerHTML = '<div class="hub-screen"><p style="color:var(--text-secondary);">⏳ Loading data…</p></div>';
  bottomNav.innerHTML = '';

  await loadProverbData();   // header skip and parsing already happen inside this function

  if (state.allProverbs.length < CONFIG.cardsPerSession) {
    mainContent.innerHTML = `<div class="hub-screen"><p style="color:var(--error);">❌ Need at least ${CONFIG.cardsPerSession} entries.</p></div>`;
    return;
  }

  renderHub();
}

      
  </script>
</body>
</html>
